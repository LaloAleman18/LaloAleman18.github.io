<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Terminal con respuestas reales de la API TaskFlow">
  <style>
    .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
    .cmd { fill: #d9a15f; }
    .key { fill: #a9d3a3; }
    .str { fill: #ece9e2; }
    .num { fill: #7fb4d9; }
    .dim { fill: #6d6a63; }
    .ok { fill: #8fb98a; }
  </style>
  <rect width="1200" height="900" fill="#0b0b0c"/>
  <rect x="70" y="150" width="1060" height="600" rx="14" fill="#101012" stroke="#2a2a2e"/>
  <rect x="70" y="150" width="1060" height="52" rx="14" fill="#16181d"/>
  <rect x="70" y="188" width="1060" height="14" fill="#16181d"/>
  <circle cx="112" cy="176" r="7" fill="#e0655f"/>
  <circle cx="138" cy="176" r="7" fill="#d9a15f"/>
  <circle cx="164" cy="176" r="7" fill="#8fb98a"/>
  <text x="200" y="181" class="mono dim" font-size="17">taskflow-api — bash</text>

  <text x="110" y="252" class="mono cmd" font-size="21">$ curl -X POST localhost:3000/api/tareas \</text>
  <text x="140" y="282" class="mono cmd" font-size="21">  -H "Content-Type: application/json" \</text>
  <text x="140" y="312" class="mono cmd" font-size="21">  -d '{"titulo":"Estudiar Node","prioridad":"alta"}'</text>

  <text x="110" y="360" class="mono" font-size="21"><tspan class="dim">{ </tspan><tspan class="key">"id"</tspan><tspan class="dim">: </tspan><tspan class="num">1</tspan><tspan class="dim">, </tspan><tspan class="key">"titulo"</tspan><tspan class="dim">: </tspan><tspan class="str">"Estudiar Node"</tspan><tspan class="dim">,</tspan></text>
  <text x="110" y="392" class="mono" font-size="21"><tspan class="dim">  </tspan><tspan class="key">"prioridad"</tspan><tspan class="dim">: </tspan><tspan class="str">"alta"</tspan><tspan class="dim">, </tspan><tspan class="key">"completada"</tspan><tspan class="dim">: </tspan><tspan class="ok">false</tspan><tspan class="dim">,</tspan></text>
  <text x="110" y="424" class="mono" font-size="21"><tspan class="dim">  </tspan><tspan class="key">"creadaEn"</tspan><tspan class="dim">: </tspan><tspan class="str">"2026-11-21T02:14:20.993Z"</tspan><tspan class="dim"> }</tspan></text>

  <text x="110" y="486" class="mono cmd" font-size="21">$ curl "localhost:3000/api/tareas?completada=false"</text>
  <text x="110" y="526" class="mono" font-size="21"><tspan class="ok">200 OK</tspan><tspan class="dim">  </tspan><tspan class="str">[{ "id": 1, "titulo": "Estudiar Node", ... }]</tspan></text>

  <text x="110" y="588" class="mono cmd" font-size="21">$ curl -X POST localhost:3000/api/tareas -d '{}'</text>
  <text x="110" y="628" class="mono" font-size="21"><tspan class="ok">400</tspan><tspan class="dim">  </tspan><tspan class="str">{ "errores": ["El campo \"titulo\" es obligatorio."] }</tspan></text>

  <text x="110" y="690" class="mono cmd" font-size="21">$ curl -X DELETE localhost:3000/api/tareas/1</text>
  <text x="110" y="730" class="mono" font-size="21"><tspan class="ok">204 No Content</tspan></text>
</svg>
