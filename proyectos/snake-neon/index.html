<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Neón — juego en canvas</title>
  <meta name="description" content="El clásico Snake en Canvas 2D, sin librerías, con controles de teclado y táctiles, niveles y récord guardado.">
  <meta name="theme-color" content="#080611">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080611'/%3E%3Cpath d='M16 44h12V22h20' fill='none' stroke='%2335f0c0' stroke-width='7' stroke-linecap='square'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #080611;
      --panel: rgba(14, 11, 28, .8);
      --ink: #f2edff;
      --dim: #a79fc4;
      --faint: #6b6488;
      --line: rgba(242, 237, 255, .14);
      --cian: #35f0c0;
      --rosa: #ff4fa3;
      --morado: #9a6bff;
      --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(154, 107, 255, .18), transparent 55%),
        radial-gradient(circle at 90% 100%, rgba(53, 240, 192, .1), transparent 45%),
        var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--cian); outline-offset: 3px; }

    .maquina { width: min(560px, 100%); padding: 24px clamp(16px, 4vw, 28px) 34px; }

    .cabecera { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .titulo { margin: 0; font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 400; letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 0 18px rgba(53, 240, 192, .45); }
    .titulo b { color: var(--cian); font-weight: 400; }
    .subtitulo { margin: 4px 0 0; color: var(--faint); font-size: 8.5px; letter-spacing: .16em; text-transform: uppercase; }

    .marcador { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 16px; }
    .marcador > div { background: var(--panel); padding: 10px 12px; }
    .marcador span { display: block; color: var(--faint); font-size: 8px; letter-spacing: .14em; text-transform: uppercase; }
    .marcador strong { display: block; margin-top: 5px; font-size: clamp(1.1rem, 4vw, 1.5rem); font-weight: 400; font-variant-numeric: tabular-nums; }
    .marcador strong.puntos { color: var(--cian); }
    .marcador strong.nivel { color: var(--rosa); }
    .marcador strong.record { color: var(--morado); }

    .pantalla { position: relative; width: 100%; aspect-ratio: 1; border: 1px solid rgba(53, 240, 192, .35); box-shadow: 0 0 30px rgba(53, 240, 192, .08), inset 0 0 40px rgba(0, 0, 0, .6); background: #05040d; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }

    .overlay { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; padding: 20px; background: rgba(5, 4, 13, .78); backdrop-filter: blur(2px); }
    .overlay[hidden] { display: none; }
    .overlay__marca { color: var(--cian); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; }
    .overlay h2 { margin: 0; font-size: clamp(1.5rem, 6vw, 2.4rem); font-weight: 400; letter-spacing: .06em; text-shadow: 0 0 16px rgba(255, 79, 163, .5); }
    .overlay p { margin: 0; color: var(--dim); font-size: 11px; line-height: 1.7; }
    .overlay strong { color: var(--ink); }
    .overlay__record { color: var(--rosa); font-size: 11px; text-shadow: 0 0 12px rgba(255, 79, 163, .6); }

    .controles { display: flex; gap: 10px; margin-top: 16px; }
    .boton { flex: 1; padding: 13px 10px; border: 1px solid var(--cian); background: transparent; color: var(--cian); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; transition: background .2s, color .2s, box-shadow .2s; }
    .boton:hover { background: var(--cian); color: var(--bg); box-shadow: 0 0 18px rgba(53, 240, 192, .35); }
    .boton--rosa { border-color: var(--rosa); color: var(--rosa); }
    .boton--rosa:hover { background: var(--rosa); color: var(--bg); box-shadow: 0 0 18px rgba(255, 79, 163, .35); }

    .dpad { display: grid; grid-template-columns: repeat(3, 62px); grid-template-rows: repeat(2, 56px); justify-content: center; gap: 8px; margin-top: 20px; }
    .dpad button { border: 1px solid var(--line); background: var(--panel); color: var(--dim); font-size: 20px; cursor: pointer; touch-action: manipulation; transition: border-color .15s, color .15s; }
    .dpad button:hover, .dpad button.activo { border-color: var(--cian); color: var(--cian); }
    .dpad__arriba { grid-column: 2; }
    .dpad__izquierda { grid-column: 1; grid-row: 2; }
    .dpad__abajo { grid-column: 2; grid-row: 2; }
    .dpad__derecha { grid-column: 3; grid-row: 2; }

    .pista { margin: 18px 0 0; color: var(--faint); font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; line-height: 1.9; text-align: center; }
    .foot { margin-top: 12px; color: var(--faint); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; text-align: center; }

    @media (max-width: 420px) {
      .dpad { grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 52px); }
    }
  </style>
</head>
<body>
  <main class="maquina">
    <header class="cabecera">
      <div>
        <h1 class="titulo">Snake <b>Neón</b></h1>
        <p class="subtitulo">Canvas 2D · 20 × 20</p>
      </div>
    </header>

    <div class="marcador" aria-live="polite">
      <div><span>Puntos</span><strong class="puntos" id="puntos">0</strong></div>
      <div><span>Nivel</span><strong class="nivel" id="nivel">1</strong></div>
      <div><span>Récord</span><strong class="record" id="record">0</strong></div>
    </div>

    <div class="pantalla">
      <canvas id="juego" width="480" height="480" aria-label="Tablero del juego Snake Neón"></canvas>
      <div class="overlay" id="overlay">
        <p class="overlay__marca" id="overlay-marca">Listo para jugar</p>
        <h2 id="overlay-titulo">Snake Neón</h2>
        <p id="overlay-texto">Come comida, crece y no te choques. Usa las flechas, WASD o los botones de abajo.</p>
        <p class="overlay__record" id="overlay-record" hidden></p>
      </div>
    </div>

    <div class="controles">
      <button class="boton" id="jugar" type="button">Jugar</button>
      <button class="boton boton--rosa" id="pausa" type="button">Pausa</button>
    </div>

    <div class="dpad" aria-label="Controles táctiles">
      <button class="dpad__arriba" type="button" data-direccion="arriba" aria-label="Arriba">↑</button>
      <button class="dpad__izquierda" type="button" data-direccion="izquierda" aria-label="Izquierda">←</button>
      <button class="dpad__abajo" type="button" data-direccion="abajo" aria-label="Abajo">↓</button>
      <button class="dpad__derecha" type="button" data-direccion="derecha" aria-label="Derecha">→</button>
    </div>

    <p class="pista">Flechas o WASD para moverte · cada 50 puntos subes de nivel</p>
    <p class="foot">Sin librerías · el récord se guarda en este navegador</p>
  </main>

  <script src="./game.js"></script>
</body>
</html>
